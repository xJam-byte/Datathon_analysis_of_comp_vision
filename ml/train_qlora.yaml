### LLaMA-Factory QLoRA 4-bit fine-tuning config for Qwen2.5-VL-7B-Instruct
### Оптимизировано для обучения на GPU с 16 ГБ VRAM (Google Colab T4 / RTX 3090 / 4090)
### Запуск: llamafactory-cli train ml/train_qlora.yaml

### ─── Модель ───────────────────────────────────────────────────────────
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
trust_remote_code: true

### ─── Метод (QLoRA 4-bit) ──────────────────────────────────────────────
stage: sft
do_train: true
finetuning_type: lora
quantization_bit: 4          # 4-bit квантование (QLoRA) для экономии VRAM
quantization_method: bitsandbytes
lora_rank: 16                # Согласно PLAN.md (r = 16)
lora_alpha: 32               # Согласно PLAN.md (alpha = 32)
lora_dropout: 0.05
lora_target: all             # Все линейные проекции: q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj

### ─── Датасет ─────────────────────────────────────────────────────────
dataset_dir: ./dataset_output
dataset: sharegpt_train
eval_dataset: sharegpt_val
template: qwen2_vl
cutoff_len: 2048
preprocessing_num_workers: 2

### ─── Обучение ────────────────────────────────────────────────────────
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
num_train_epochs: 3
weight_decay: 0.01
max_grad_norm: 1.0

### ─── Оптимизация памяти ─────────────────────────────────────────────
bf16: false
fp16: true
gradient_checkpointing: true
flash_attn: auto

### ─── Логирование и чекпоинты ─────────────────────────────────────────
logging_steps: 5
eval_steps: 25
save_steps: 50
save_total_limit: 2
report_to: none
output_dir: ./lora_output

### ─── Валидация ───────────────────────────────────────────────────────
do_eval: true
eval_strategy: steps
per_device_eval_batch_size: 1

### ─── Воспроизводимость ──────────────────────────────────────────────
seed: 42

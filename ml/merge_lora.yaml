### Мёрж LoRA-адаптера в базовую модель (LLaMA-Factory export)
### Запуск: llamafactory-cli export ml/merge_lora.yaml
### Нужно ~20 ГБ RAM. Базовая модель НЕ квантуется (иначе веса испортятся).

model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
adapter_name_or_path: ml/lora            # распакованный cashguard_lora_final.zip
template: qwen2_vl
finetuning_type: lora
trust_remote_code: true

export_dir: ml/merged_model
export_size: 5
export_device: cpu
export_legacy_format: false
